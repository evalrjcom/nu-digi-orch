[package]
name = "nu-digi-orch"
version = "0.7.8"
edition = "2021"
description = "Lightweight MIDI composer and SoundFont player"

[dependencies]
fltk = { version = "=1.5.22", features = ["no-pango", "no-gdiplus"] }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
midir = "0.10"
cpal = "0.15"
rustysynth = "1.3.6"
hound = "3.5"
tempfile = "3"
